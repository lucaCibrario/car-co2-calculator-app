[project]
name = "eco-car-replacement-advisor"
version = "0.1.0"
description = "Desktop app for comparing life-cycle CO2 emissions when replacing a car"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.4.2,<3",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.0.0,<4",
    "plotly>=6.5.2,<7",
    "PySide6>=6.10.2,<7",
    "scipy>=1.17.0,<2",
]

[dependency-groups]
build = ["pyinstaller>=6.18.0,<7"]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
