name: Quality checks

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run --no-sync ruff check eco_car_advisor tests EcoCarReplacementAdvisor.py
          uv run --no-sync ruff format --check eco_car_advisor tests EcoCarReplacementAdvisor.py
      - name: Run regression and GUI workflow tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: uv run --no-sync python -m unittest discover -s tests -v
